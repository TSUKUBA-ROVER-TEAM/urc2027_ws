launch:
  - arg:
      name: arm_4_only
      default: 'false'

  - arg:
      name: yaw_deadzone
      default: '0.1'

  - node:
      pkg: joy
      exec: joy_node
      name: joy_node
      output: screen

  - node:
      pkg: urc2027_manual
      exec: manual_controller_node
      name: manual_controller
      output: screen
      param:
        - name: arm_4_only
          value: $(var arm_4_only)
        - name: yaw_deadzone
          value: $(var yaw_deadzone)
