launch:
  - arg:
      name: itr_can_interface
      default: can0
  - arg:
      name: odrive_can_interface
      default: can1
  - arg:
      name: odrive_node_id
      default: '0'

  - include:
      file: $(find-pkg-share urc2027_bringup)/launch/real.launch.yaml
      arg:
        - name: launcher_only
          value: 'false'
        - name: arm_only
          value: 'false'
        - name: drive_only
          value: 'true'
        - name: use_odrive_launcher
          value: 'true'
        - name: itr_can_interface
          value: $(var itr_can_interface)
        - name: odrive_can_interface
          value: $(var odrive_can_interface)
        - name: odrive_node_id
          value: $(var odrive_node_id)
